site_name: Selenium Test Lens 0.1.0
site_description: Archived documentation for the published Selenium Test Lens 0.1.0 release.
site_url: https://test-lens.github.io/selenium-test-lens/
repo_name: Test-Lens/selenium-test-lens
repo_url: https://github.com/Test-Lens/selenium-test-lens
edit_uri: ""
docs_dir: docs-versions/0.1.0
strict: true

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest

nav:
  - Overview: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Session lifecycle: session-lifecycle.md
  - Locators: locators.md
  - Element actions: element-actions.md
  - Assertions and waits: assertions-and-waits.md
  - HUD and overlay: hud-and-overlay.md
  - Screenshots and video evidence: screenshots-and-video.md
  - Trace and reports: trace-and-reports.md
  - Manual network diagnostics: manual-network-diagnostics.md
  - Authentication state: auth-state.md
  - React integration: react-integration.md
  - Configuration: configuration.md
  - Examples: examples.md
  - Known limitations: known-limitations.md
  - Published API: published-api.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

extra:
  version:
    provider: mike
    default: latest
    current: 0.1.0
    is_dev: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
