name: Release Check

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -q test

      - name: Verify Central release profile without signing
        run: mvn -U -Pcentral-release -Dgpg.skip=true -DskipTests verify

      - name: Validate release artifact whitelist and licenses
        shell: pwsh
        run: ./scripts/validate-release-packaging.ps1

      - name: Run empty-M2 clean-room release consumer
        shell: pwsh
        run: ./scripts/validate-clean-room-consumer.ps1
