name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      operation:
        description: Safe documentation operation
        required: true
        type: choice
        default: validate-only
        options: [validate-only, publish-dev, bootstrap-0.1.0, redeploy-release, redeploy-pages]
      version:
        description: Existing MAJOR.MINOR.PATCH to repair (redeploy-release only)
        required: false
        type: string
      source_ref:
        description: Exact release source ref; redeploy-pages does not rebuild docs
        required: false
        type: string
      confirmation:
        description: Exact confirmation required for bootstrap or release-docs repair
        required: false
        type: string

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate redeploy request inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'redeploy-release'
        shell: pwsh
        env:
          DOCS_REDEPLOY_VERSION: ${{ github.event.inputs.version }}
          DOCS_REDEPLOY_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DOCS_REDEPLOY_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          if ($env:DOCS_REDEPLOY_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'redeploy-release requires version MAJOR.MINOR.PATCH.' }
          if ([string]::IsNullOrWhiteSpace($env:DOCS_REDEPLOY_SOURCE_REF)) { throw 'redeploy-release requires source_ref.' }
          if ($env:DOCS_REDEPLOY_SOURCE_REF -ne "release/$($env:DOCS_REDEPLOY_VERSION)") { throw 'source_ref must be release/<version>.' }
          if ($env:DOCS_REDEPLOY_CONFIRMATION -ne "redeploy-docs-$($env:DOCS_REDEPLOY_VERSION)") { throw 'Exact redeploy confirmation is required.' }
      - name: Check out validation source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'redeploy-release' && github.event.inputs.source_ref || github.event_name == 'workflow_dispatch' && github.event.inputs.operation != 'validate-only' && 'main' || github.ref }}
      - name: Validate redeploy source version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'redeploy-release'
        shell: pwsh
        env:
          DOCS_REDEPLOY_VERSION: ${{ github.event.inputs.version }}
        run: |
          [xml]$pom = Get-Content pom.xml
          $ns = [Xml.XmlNamespaceManager]::new($pom.NameTable)
          $ns.AddNamespace('m','http://maven.apache.org/POM/4.0.0')
          $sourceVersion = $pom.SelectSingleNode('/m:project/m:version',$ns).InnerText.Trim()
          if ($sourceVersion -ne $env:DOCS_REDEPLOY_VERSION) { throw "Root POM version '$sourceVersion' does not match requested redeploy '$($env:DOCS_REDEPLOY_VERSION)'." }
          ./scripts/check-reactor-versions.ps1 -ExpectedVersion $env:DOCS_REDEPLOY_VERSION
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build both documentation sources strictly
        run: |
          mkdocs build --strict --site-dir "${RUNNER_TEMP}/dev-site"
          mkdocs build --strict --config-file mkdocs-0.1.0.yml --site-dir "${RUNNER_TEMP}/stable-site"
      - name: Validate documentation contracts
        shell: pwsh
        run: |
          ./scripts/check-doc-links.ps1
          ./scripts/check-hud-demo.ps1 -SiteDirectory "${env:RUNNER_TEMP}/dev-site"
          ./scripts/check-doc-signatures.ps1
          ./scripts/check-doc-version-boundary.ps1
          ./scripts/validate-stable-doc-examples.ps1
          ./scripts/validate-versioned-docs.ps1
      - name: Validate workflow YAML
        run: python -c "import pathlib,yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

  publish:
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'validate-only')
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'redeploy-release' && github.event.inputs.source_ref || github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --tags || git fetch origin --tags
      - name: Publish development documentation
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'publish-dev')
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $ns = [Xml.XmlNamespaceManager]::new($pom.NameTable)
          $ns.AddNamespace('m','http://maven.apache.org/POM/4.0.0')
          $version = $pom.SelectSingleNode('/m:project/m:version',$ns).InnerText.Trim()
          ./scripts/publish-versioned-docs.ps1 -Operation dev -Version $version
      - name: Bootstrap immutable 0.1.0 documentation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'bootstrap-0.1.0'
        shell: pwsh
        run: |
          git rev-parse --verify refs/tags/v0.1.0
          ./scripts/check-doc-version-boundary.ps1 -ReleaseTag v0.1.0
          ./scripts/publish-versioned-docs.ps1 -Operation bootstrap-0.1.0 -Confirmation '${{ github.event.inputs.confirmation }}'
      - name: Repair existing release documentation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'redeploy-release'
        shell: pwsh
        env:
          DOCS_REDEPLOY_VERSION: ${{ github.event.inputs.version }}
          DOCS_REDEPLOY_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DOCS_REDEPLOY_CONFIRMATION: ${{ github.event.inputs.confirmation }}
        run: |
          # Explicit administrative exception to immutable docs; never use it to change released API semantics.
          [xml]$pom = Get-Content pom.xml
          $ns = [Xml.XmlNamespaceManager]::new($pom.NameTable)
          $ns.AddNamespace('m','http://maven.apache.org/POM/4.0.0')
          $sourceVersion = $pom.SelectSingleNode('/m:project/m:version',$ns).InnerText.Trim()
          if ($sourceVersion -ne $env:DOCS_REDEPLOY_VERSION) { throw "Root POM version '$sourceVersion' does not match requested redeploy '$($env:DOCS_REDEPLOY_VERSION)'." }
          ./scripts/check-reactor-versions.ps1 -ExpectedVersion $env:DOCS_REDEPLOY_VERSION
          $env:DOCS_RELEASE_VERSION = $env:DOCS_REDEPLOY_VERSION
          $env:DOCS_RELEASE_EDIT_URI = "edit/$($env:DOCS_REDEPLOY_SOURCE_REF)/docs/"
          ./scripts/publish-versioned-docs.ps1 -Operation redeploy-release -Version $env:DOCS_REDEPLOY_VERSION -Confirmation $env:DOCS_REDEPLOY_CONFIRMATION
      - name: Publish immutable tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Tag must be vMAJOR.MINOR.PATCH.' }
          $version = $Matches[1]
          ./scripts/check-reactor-versions.ps1 -ExpectedVersion $version
          $env:DOCS_RELEASE_VERSION = $version
          $env:DOCS_RELEASE_EDIT_URI = "edit/${{ github.ref_name }}/docs/"
          ./scripts/publish-versioned-docs.ps1 -Operation release -Version $version
      - name: Check out complete gh-pages staging tree
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages-stage
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-stage

  deploy:
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'validate-only')
    needs: publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy complete versioned site
        id: deployment
        uses: actions/deploy-pages@v4
