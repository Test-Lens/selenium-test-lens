name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bidi_wire_diagnostics:
        description: Capture bounded, sanitized BiDi fixture event phases for diagnosis
        type: boolean
        default: false

jobs:
  selenium-bidi-browser:
    name: Same-JAR Chrome 157 capture, reports and Grid (Windows)
    needs: selenium-bidi-binary
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: browser-actions/setup-chrome@v2
        id: browser
        with:
          chrome-version: "157.0.8103.78"
          install-chromedriver: true
      - uses: actions/download-artifact@v4
        with:
          name: selenium-bidi-binary
          path: target/linux-frozen-artifacts
      - name: Locate the single Linux-built artifact manifest
        run: |
          $manifests = @(Get-ChildItem target/linux-frozen-artifacts -Recurse -Filter artifact-sha256.json)
          if ($manifests.Count -ne 1) { throw 'Expected exactly one Linux frozen-artifact manifest' }
          "FROZEN_RUN=$($manifests[0].Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify pair and run every unchanged probe within the owned Grid lifetime
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          DRIVER_BINARY: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/windows-bidi-diagnostic | Out-Null
          $chromeVersion = (Get-Item -LiteralPath $env:CHROME_BINARY).VersionInfo.ProductVersion
          $driverVersion = (& $env:DRIVER_BINARY --version).Split(' ')[1]
          if ($chromeVersion -ne '157.0.8103.78' -or $driverVersion -ne $chromeVersion) { throw 'Browser pair mismatch' }
          @{ chromeVersion = $chromeVersion; chromeDriverVersion = $driverVersion; mapper = 'stock'; os = 'Windows'; source = $env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content target/windows-bidi-diagnostic/browser-pair.json
          Get-FileHash consumer-tests/selenium-bidi/protocol-reproducer/src/test/java/release/diagnostic/ProtocolRedirectIntegrityTest.java |
            ConvertTo-Json | Set-Content target/windows-bidi-diagnostic/probe-source.json
          Invoke-WebRequest https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.53.0/selenium-server-4.53.0.jar -OutFile target/windows-bidi-diagnostic/selenium-server.jar
          $jar = (Resolve-Path target/windows-bidi-diagnostic/selenium-server.jar).Path
          $process = Start-Process -FilePath "$env:JAVA_HOME/bin/java.exe" -ArgumentList @("-Dwebdriver.chrome.driver=`"$env:DRIVER_BINARY`"", '-jar', "`"$jar`"", 'standalone', '--host', '127.0.0.1', '--port', '4444') -WindowStyle Hidden -PassThru -RedirectStandardOutput target/windows-bidi-diagnostic/grid.stdout.log -RedirectStandardError target/windows-bidi-diagnostic/grid.stderr.log
          $process.Id | Set-Content target/windows-bidi-diagnostic/grid.pid
          $outcomes = [ordered]@{}
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) { throw 'Owned Grid exited during setup' }
              try { $ready = (Invoke-RestMethod http://127.0.0.1:4444/status).value.ready } catch {}
              if ($ready) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Owned Grid did not become ready' }
            try {
              ./scripts/test-selenium-bidi-compatibility.ps1 -BrowserTests -GridUrl http://127.0.0.1:4444 -ChromeBinary $env:CHROME_BINARY -ChromeDriver $env:DRIVER_BINARY -WireDiagnostics:$false -ReuseFrozenRun $env:FROZEN_RUN
              $outcomes.matrix = 'PASS'
            } catch {
              $outcomes.matrix = 'FAIL'
              Write-Host $_
            }
            foreach ($mode in @('local', 'grid')) {
              $arguments = @('-B', '-f', 'consumer-tests/selenium-bidi/protocol-reproducer/pom.xml', 'clean', 'test', "-Dtest.chrome.binary=$env:CHROME_BINARY", "-Dwebdriver.chrome.driver=$env:DRIVER_BINARY", "-Dprobe.output=$PWD/target/windows-bidi-diagnostic/protocol-$mode")
              if ($mode -eq 'grid') { $arguments += '-Dbidi.grid=http://127.0.0.1:4444' }
              & mvn @arguments *> "target/windows-bidi-diagnostic/protocol-$mode.log"
              $probeExit = $LASTEXITCODE
              if (Test-Path consumer-tests/selenium-bidi/protocol-reproducer/target/surefire-reports) { Copy-Item consumer-tests/selenium-bidi/protocol-reproducer/target/surefire-reports "target/windows-bidi-diagnostic/$mode-surefire" -Recurse }
              $outcomes[$mode] = if ($probeExit -eq 0) { 'PASS' } else { 'FAIL' }
              Write-Host "Standalone $mode (50 unchanged stimuli): $($outcomes[$mode])"
            }
          } finally {
            Stop-Process -InputObject $process -ErrorAction SilentlyContinue
            $outcomes | ConvertTo-Json | Set-Content target/windows-bidi-diagnostic/outcomes.json
          }
          if ($outcomes.Count -ne 3 -or $outcomes.Values -contains 'FAIL') { throw 'Windows configuration diagnostic failed; inspect independent outcomes and XML' }
      - name: Preserve every required Windows browser outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-bidi-windows-browser
          path: |
            target/windows-bidi-diagnostic/*.json
            target/windows-bidi-diagnostic/*.log
            target/windows-bidi-diagnostic/protocol-*/**
            target/windows-bidi-diagnostic/*-surefire/**
            target/selenium-bidi-compatibility/**
            consumer-tests/selenium-bidi/protocol-reproducer/target/surefire-reports/**
          if-no-files-found: warn

  selenium-bidi-binary:
    name: Same-JAR Selenium BiDi compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build once and verify all nine binary runtimes on Linux
        shell: pwsh
        run: ./scripts/test-selenium-bidi-compatibility.ps1
      - name: Preserve the frozen JARs, hashes and every binary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-bidi-binary
          path: target/selenium-bidi-compatibility/**
          if-no-files-found: error

  chrome-158-protocol-canary:
    name: Chrome 158 protocol canary (${{ matrix.mode }}, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [local, grid]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: browser-actions/setup-chrome@v2
        id: canary-chrome
        with:
          chrome-version: "158.0.8127.36"
          install-chromedriver: true
      - name: Verify canary browser pair and record unchanged probe source
        shell: bash
        env:
          CHROME_BINARY: ${{ steps.canary-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.canary-chrome.outputs.chromedriver-path }}
        run: |
          mkdir -p target/chrome-158-protocol-canary
          chrome_version="$("$CHROME_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          driver_version="$("$CHROMEDRIVER_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          printf 'Chrome=%s\nChromeDriver=%s\n' "$chrome_version" "$driver_version" | tee target/chrome-158-protocol-canary/browser-pair.txt
          test "$chrome_version" = '158.0.8127.36'
          test "$driver_version" = "$chrome_version"
          sha256sum consumer-tests/selenium-bidi/protocol-reproducer/src/test/java/release/diagnostic/ProtocolRedirectIntegrityTest.java | tee target/chrome-158-protocol-canary/probe-source.sha256
      - name: Start owned canary Grid
        if: matrix.mode == 'grid'
        shell: bash
        env:
          CHROMEDRIVER_BINARY: ${{ steps.canary-chrome.outputs.chromedriver-path }}
        run: |
          curl --fail --location --retry 2 -o target/canary-selenium-server.jar https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.53.0/selenium-server-4.53.0.jar
          java "-Dwebdriver.chrome.driver=$CHROMEDRIVER_BINARY" -jar target/canary-selenium-server.jar standalone --host 127.0.0.1 --port 4444 > target/chrome-158-protocol-canary/grid.log 2>&1 &
          echo "$!" > target/chrome-158-protocol-canary/grid.pid
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:4444/status | grep -q '"ready": true'; then exit 0; fi
            sleep 1
          done
          cat target/chrome-158-protocol-canary/grid.log
          exit 1
      - name: Run unchanged raw protocol assertions on Chrome 158
        id: protocol
        shell: pwsh
        env:
          PROBE_MODE: ${{ matrix.mode }}
          CHROME_BINARY: ${{ steps.canary-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.canary-chrome.outputs.chromedriver-path }}
        run: |
          $arguments = @('-B', '-f', 'consumer-tests/selenium-bidi/protocol-reproducer/pom.xml', 'test',
            "-Dtest.chrome.binary=$env:CHROME_BINARY", "-Dwebdriver.chrome.driver=$env:CHROMEDRIVER_BINARY",
            "-Dprobe.output=$env:GITHUB_WORKSPACE/target/chrome-158-protocol-canary")
          if ($env:PROBE_MODE -eq 'grid') { $arguments += '-Dbidi.grid=http://127.0.0.1:4444' }
          & mvn @arguments
          exit $LASTEXITCODE
      - name: Summarize actual canary test outcome
        if: always()
        shell: pwsh
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_STEP_OUTCOME: ${{ steps.protocol.outcome }}
        run: |
          New-Item -ItemType Directory -Force -Path target/chrome-158-protocol-canary | Out-Null
          $report = 'consumer-tests/selenium-bidi/protocol-reproducer/target/surefire-reports/TEST-release.diagnostic.ProtocolRedirectIntegrityTest.xml'
          $status = 'NOT RUN (no JUnit report)'
          if (Test-Path -LiteralPath $report) {
            [xml]$junit = Get-Content -LiteralPath $report -Raw
            $status = if ([int]$junit.testsuite.failures -gt 0 -or [int]$junit.testsuite.errors -gt 0) { 'FAIL' }
              elseif ([int]$junit.testsuite.tests -eq 1 -and [int]$junit.testsuite.skipped -eq 0) { 'PASS' }
              else { 'INCOMPLETE' }
          }
          $lines = @("### Chrome 158 protocol canary ($env:PROBE_MODE)",
            "JUnit result: $status", "Maven step outcome: $env:PROBE_STEP_OUTCOME",
            'This stock-mapper canary is non-blocking; failed assertions remain failures. Consult required browser-pair artifacts for the separately validated release configuration.')
          foreach ($path in @('target/chrome-158-protocol-canary/browser-pair.txt', 'target/chrome-158-protocol-canary/probe-source.sha256')) {
            if (Test-Path -LiteralPath $path) { $lines += Get-Content -LiteralPath $path }
          }
          $lines | Tee-Object -FilePath target/chrome-158-protocol-canary/summary.txt | Out-Host
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Stop owned canary Grid
        if: always()
        shell: bash
        run: |
          if test -f target/chrome-158-protocol-canary/grid.pid; then kill "$(cat target/chrome-158-protocol-canary/grid.pid)" || true; fi
      - name: Preserve canary evidence and actual test failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-158-protocol-canary-${{ matrix.mode }}
          path: |
            target/chrome-158-protocol-canary/**
            consumer-tests/selenium-bidi/protocol-reproducer/target/surefire-reports/**

  consumer-compatibility:
    name: Consumer compatibility (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate Maven and Gradle clean-room consumers
        shell: pwsh
        run: ./scripts/validate-consumer-compatibility.ps1 -KeepWorkDirectoryOnFailure

      - name: Upload consumer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-compatibility-jdk-${{ matrix.java }}-failure
          if-no-files-found: warn
          path: |
            consumer-tests/gradle/build/reports/**
            consumer-tests/gradle/build/test-results/**
            **/target/surefire-reports/**

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check reactor version
        shell: pwsh
        run: ./scripts/check-reactor-versions.ps1

      - name: Check prepared release policy
        shell: pwsh
        run: ./scripts/test-prepared-release-policy.ps1

      - name: Run tests
        run: mvn -q test

      - name: Check public API documentation manifest
        shell: pwsh
        run: ./scripts/check-public-api.ps1

      - name: Check public API since tags
        shell: pwsh
        run: ./scripts/check-public-api-since.ps1

      - name: Check documented Java signatures
        shell: pwsh
        run: ./scripts/check-doc-signatures.ps1

      - name: Check published Javadoc language
        shell: pwsh
        run: |
          ./scripts/check-public-javadoc-language.ps1
          ./scripts/test-public-javadoc-language.ps1

      - name: Build release artifacts
        run: mvn -U -Prelease-artifacts -DskipTests package

      - name: Validate release artifact whitelist and licenses
        shell: pwsh
        run: ./scripts/validate-release-packaging.ps1

      - name: Preserve reactor test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactor-test-results
          if-no-files-found: warn
          path: '**/target/surefire-reports/TEST-*.xml'

  browser-integration:
    name: Browser integration (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "157.0.8103.78"
          install-chromedriver: true

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Set up geckodriver
        if: matrix.browser == 'firefox'
        id: setup-geckodriver
        uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8 # distribution commit with bundled index.js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve geckodriver path
        if: matrix.browser == 'firefox'
        id: resolve-geckodriver
        shell: bash
        run: |
          geckodriver_path="$(command -v geckodriver || true)"
          if [[ -z "$geckodriver_path" ]]; then
            echo "::error::geckodriver was installed but could not be resolved from PATH"
            exit 1
          fi
          if [[ ! -x "$geckodriver_path" ]]; then
            echo "::error::resolved geckodriver is not executable: $geckodriver_path"
            exit 1
          fi
          echo "geckodriver-path=$geckodriver_path" >> "$GITHUB_OUTPUT"

      - name: Report selected Chrome binaries
        if: matrix.browser == 'chrome'
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome binary: $TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          echo "ChromeDriver binary: $TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version
          chrome_version="$("$TEST_CHROME_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          driver_version="$("$TEST_CHROMEDRIVER_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          test "$chrome_version" = '157.0.8103.78'
          test "$driver_version" = "$chrome_version"
          mkdir -p target/bidi-browser-transport
          printf '{"chromeVersion":"%s","chromeDriverVersion":"%s","mapper":"stock"}\n' "$chrome_version" "$driver_version" > target/bidi-browser-transport/browser-pair.json
          echo "WebDriver BiDi: enabled for dedicated network integration tests"

      - name: Report selected Firefox binaries
        if: matrix.browser == 'firefox'
        env:
          TEST_FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
          TEST_GECKODRIVER_BINARY: ${{ steps.resolve-geckodriver.outputs.geckodriver-path }}
        run: |
          echo "Firefox binary: $TEST_FIREFOX_BINARY"
          test -x "$TEST_FIREFOX_BINARY" || { echo "::error::Firefox binary is not executable: $TEST_FIREFOX_BINARY"; exit 1; }
          "$TEST_FIREFOX_BINARY" --version
          echo "GeckoDriver binary: $TEST_GECKODRIVER_BINARY"
          test -x "$TEST_GECKODRIVER_BINARY" || { echo "::error::GeckoDriver binary is not executable: $TEST_GECKODRIVER_BINARY"; exit 1; }
          "$TEST_GECKODRIVER_BINARY" --version
          echo "WebDriver BiDi: enabled for dedicated network integration tests"

      - name: Run Chrome real-browser integration tests
        if: matrix.browser == 'chrome'
        env:
          # The targeted JUnit executor runs in a sanitized child process and only
          # forwards the explicit SE_BROWSER_* host configuration. Chrome for
          # Testing is an archive install without a usable SUID sandbox here.
          SE_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_BROWSER_NO_SANDBOX: "true"
        run: >-
          mvn -Pbrowser-it -Dbrowser=chrome -Dheaded=false
          -Dtest.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
          -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
          verify

      - name: Run Firefox real-browser integration tests
        if: matrix.browser == 'firefox'
        run: >-
          mvn -Pbrowser-it -Dbrowser=firefox -Dheaded=false
          -Dtest.firefox.binary="${{ steps.setup-firefox.outputs.firefox-path }}"
          -Dwebdriver.gecko.driver="${{ steps.resolve-geckodriver.outputs.geckodriver-path }}"
          verify

      - name: Preserve browser transport provenance
        if: always() && matrix.browser == 'chrome'
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-chrome-transport
          path: target/bidi-browser-transport/**
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-${{ matrix.browser }}-failure
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/ui-test-lens/**

  linux-external-certification:
    name: Linux external consumer (JDK 17, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "157.0.8103.78"
          install-chromedriver: true

      - name: Report Linux certification environment
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          SE_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_BROWSER_NO_SANDBOX: "true"
        shell: bash
        run: |
          java -version
          mvn --version
          pwsh --version
          test -x "$TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          test -x "$TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version
          chrome_version="$("$TEST_CHROME_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          driver_version="$("$TEST_CHROMEDRIVER_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          test "$chrome_version" = '157.0.8103.78'
          test "$driver_version" = "$chrome_version"
          mkdir -p target/bidi-browser-transport
          printf '{"chromeVersion":"%s","chromeDriverVersion":"%s","mapper":"stock"}\n' "$chrome_version" "$driver_version" > target/bidi-browser-transport/browser-pair.json
          echo "SE_BROWSER_PATH=${SE_BROWSER_PATH:-<unset>}"
          echo "SE_BROWSER_NO_SANDBOX=${SE_BROWSER_NO_SANDBOX:-<unset>}"
          echo "webdriver.chrome.driver=<not supplied by certification job>"
          echo "driverResolution=SELENIUM_MANAGER"
          crashpad_handler="$(dirname "$SE_BROWSER_PATH")/chrome_crashpad_handler"
          if [ -e "$crashpad_handler" ]; then stat -c 'chrome_crashpad_handler=%A' "$crashpad_handler"; fi
          df -h /dev/shm | tail -n 1
          for candidate in google-chrome chrome chromium chromium-browser chromedriver; do
            resolved="$(command -v "$candidate" 2>/dev/null || true)"
            if [ -n "$resolved" ]; then echo "PATH candidate $candidate=$resolved"; fi
          done

      - name: Certify staged external Studio consumer
        env:
          # Keep Selenium Manager's browser/driver resolution coherent. Supplying only
          # webdriver.chrome.driver made ChromeDriver 155 launch the system Chrome 154.
          SE_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Chrome for Testing is an archive install without a usable SUID sandbox
          # on the Ubuntu runner. This is explicit CI host configuration; Studio
          # keeps Chrome sandboxing enabled by default everywhere else.
          SE_BROWSER_NO_SANDBOX: "true"
        shell: pwsh
        run: |
          $repositoryRoot = (Get-Location).Path
          Import-Module (Join-Path $repositoryRoot "scripts/ReleaseReactor.psm1") -Force
          Import-Module (Join-Path $repositoryRoot "scripts/StudioCertificationSupport.psm1") -Force
          $tempRoot = New-TestLensCertificationTempRoot -RunnerTemp "${{ runner.temp }}" -Linux $true
          try {
            $env:TMPDIR = $tempRoot
            $env:TEMP = $tempRoot
            $env:TMP = $tempRoot
            $env:SE_BROWSER_DIAGNOSTICS_DIR = Join-Path $tempRoot "browser-diagnostics"
            New-Item -ItemType Directory -Force -Path $env:SE_BROWSER_DIAGNOSTICS_DIR | Out-Null
            $env:SE_BROWSER_PROFILE_ROOT = Join-Path $tempRoot "browser-profiles"
            New-Item -ItemType Directory -Force -Path $env:SE_BROWSER_PROFILE_ROOT | Out-Null
            Invoke-TestLensChromeStartupSmoke `
              -BrowserBinary $env:SE_BROWSER_PATH `
              -TempRoot (Join-Path $tempRoot "chrome-smoke") `
              -NoSandbox | Out-Host
            $rootPom = Read-TestLensPom (Join-Path $repositoryRoot "pom.xml")
            $reactorVersion = Get-TestLensPomText $rootPom "/m:project/m:version"
            ./scripts/check-reactor-versions.ps1 -ExpectedVersion $reactorVersion | Out-Host
            $repository = Join-Path $tempRoot "empty-maven-repository"
            ./scripts/certify-0.5.0-external-consumer-linux.ps1 `
              -Version $reactorVersion `
              -MavenRepository $repository

            $spaceConsumer = Join-Path $tempRoot "test lens consumer with spaces"
            Copy-Item -LiteralPath ./scripts/fixtures/s15-external-consumer `
              -Destination $spaceConsumer -Recurse -Force
            $spaceConsumerPom = Join-Path $spaceConsumer "pom.xml"
            $spaceConsumerPomText = [System.IO.File]::ReadAllText($spaceConsumerPom).Replace("0.5.0", $reactorVersion)
            [System.IO.File]::WriteAllText($spaceConsumerPom, $spaceConsumerPomText, [System.Text.UTF8Encoding]::new($false))
            & mvn "-Dmaven.repo.local=$repository" -f $spaceConsumerPom test-compile
            if ($LASTEXITCODE -ne 0) { throw "External consumer path-with-spaces compilation failed" }
          } finally {
            Remove-TestLensCertificationTempRoot -Path $tempRoot
          }

      - name: Preserve external consumer transport provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-consumer-browser-transport
          path: target/bidi-browser-transport/**
      - name: Upload external certification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-external-certification-failure
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/test-lens-s15-temp/**/studio-*.log
            ${{ runner.temp }}/test-lens-s15-temp/**/target/surefire-reports/**

  headed-chrome-smoke:
    name: Headed Chrome smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "157.0.8103.78"
          install-chromedriver: true

      - name: Report selected Chrome binaries
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome binary: $TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          echo "ChromeDriver binary: $TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version
          chrome_version="$("$TEST_CHROME_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          driver_version="$("$TEST_CHROMEDRIVER_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          test "$chrome_version" = '157.0.8103.78'
          test "$driver_version" = "$chrome_version"
          mkdir -p target/bidi-browser-transport
          printf '{"chromeVersion":"%s","chromeDriverVersion":"%s","mapper":"stock"}\n' "$chrome_version" "$driver_version" > target/bidi-browser-transport/browser-pair.json

      - name: Run headed Chrome smoke under Xvfb
        env:
          # Keep the sanitized targeted-test child on the same verified browser.
          SE_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_BROWSER_NO_SANDBOX: "true"
        run: >-
          xvfb-run -a mvn -Pbrowser-it -Dbrowser=chrome -Dheaded=true
          -Dtest.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
          -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
          verify

      - name: Preserve headed browser transport provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headed-chrome-browser-transport
          path: target/bidi-browser-transport/**
      - name: Upload headed smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headed-chrome-smoke-failure
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/ui-test-lens/**

  raw-bidi-wire-diagnostic:
    name: Raw BiDi wire diagnostic (${{ matrix.chrome }}, ${{ matrix.mapper }}, non-blocking)
    if: github.event_name == 'workflow_dispatch' && inputs.bidi_wire_diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - chrome: "156.0.8078.80"
            mapper: stock
          - chrome: "157.0.8103.78"
            mapper: stock
          - chrome: "158.0.8127.36"
            mapper: stock
          - chrome: "158.0.8127.36"
            mapper: official-159
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: browser-actions/setup-chrome@v2
        if: matrix.mapper == 'stock'
        id: stock
        with:
          chrome-version: ${{ matrix.chrome }}
          install-chromedriver: true
      - uses: ./.github/actions/setup-bidi-browser
        if: matrix.mapper == 'official-159'
        id: official
        with:
          chrome-version: ${{ matrix.chrome }}
      - name: Record exact browser pair and diagnostic provenance
        shell: bash
        env:
          CHROME_BINARY: ${{ steps.stock.outputs.chrome-path || steps.official.outputs.chrome-path }}
          DRIVER_BINARY: ${{ steps.stock.outputs.chromedriver-path || steps.official.outputs.chromedriver-path }}
          MAPPER_INFO: ${{ steps.official.outputs.mapper-info }}
          EXPECTED_CHROME: ${{ matrix.chrome }}
          MAPPER: ${{ matrix.mapper }}
        run: |
          set -euo pipefail
          mkdir -p target/raw-protocol/classes
          export ACTUAL_CHROME ACTUAL_DRIVER
          ACTUAL_CHROME="$("$CHROME_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          ACTUAL_DRIVER="$("$DRIVER_BINARY" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const e = process.env;
          const root = 'consumer-tests/selenium-bidi/protocol-reproducer/raw/';
          const sources = Object.fromEntries(['RawWireFixture.java', 'raw-bidi.mjs', 'scrub-cdp.mjs'].map(name =>
            [name, crypto.createHash('sha256').update(fs.readFileSync(root + name)).digest('hex')]));
          const mapper = e.MAPPER_INFO ? JSON.parse(fs.readFileSync(e.MAPPER_INFO, 'utf8')) : {type: 'stock'};
          fs.writeFileSync('target/raw-protocol/provenance.json', JSON.stringify({
            expectedChrome: e.EXPECTED_CHROME, chromeVersion: e.ACTUAL_CHROME,
            chromeDriverVersion: e.ACTUAL_DRIVER, mapperLabel: e.MAPPER, mapper, sources
          }, null, 2) + '\n');
          NODE
          test "$ACTUAL_CHROME" = "$EXPECTED_CHROME"
          test "$ACTUAL_DRIVER" = "$ACTUAL_CHROME"
      - name: Probe raw HTTP and native WebSocket without Selenium
        id: probe
        shell: bash
        env:
          CHROME_BINARY: ${{ steps.stock.outputs.chrome-path || steps.official.outputs.chrome-path }}
          DRIVER_BINARY: ${{ steps.stock.outputs.chromedriver-path || steps.official.outputs.chromedriver-path }}
        run: |
          set -euo pipefail
          fixture_pid=''
          driver_pid=''
          cleanup() {
            if [[ -n "$driver_pid" ]]; then kill "$driver_pid" 2>/dev/null || true; wait "$driver_pid" 2>/dev/null || true; fi
            if [[ -n "$fixture_pid" ]]; then kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          raw=consumer-tests/selenium-bidi/protocol-reproducer/raw
          ready="$RUNNER_TEMP/raw-fixture-url.txt"
          rm -f "$ready"
          javac -d target/raw-protocol/classes "$raw/RawWireFixture.java"
          java -cp target/raw-protocol/classes RawWireFixture "$ready" > "$RUNNER_TEMP/raw-fixture.log" 2>&1 &
          fixture_pid=$!
          "$DRIVER_BINARY" --port=19515 --verbose --log-path="$RUNNER_TEMP/raw-driver.log" > "$RUNNER_TEMP/raw-driver-console.log" 2>&1 &
          driver_pid=$!
          started=false
          for ((attempt = 1; attempt <= 50; attempt++)); do
            kill -0 "$fixture_pid" && kill -0 "$driver_pid"
            if test -s "$ready" && curl --fail --silent --max-time 1 http://127.0.0.1:19515/status > /dev/null; then
              started=true
              break
            fi
            sleep 0.1
          done
          test "$started" = true
          echo 'started=true' >> "$GITHUB_OUTPUT"
          node "$raw/raw-bidi.mjs" --webdriver http://127.0.0.1:19515 --fixture-file "$ready" --chrome-binary "$CHROME_BINARY" --output target/raw-protocol/evidence.json
      - name: Scrub CDP evidence before any artifact upload
        if: always()
        id: scrub
        shell: bash
        run: |
          mkdir -p target/raw-protocol
          node consumer-tests/selenium-bidi/protocol-reproducer/raw/scrub-cdp.mjs --input "$RUNNER_TEMP/raw-driver.log" --output target/raw-protocol/cdp.json
      - name: Summarize actual raw protocol result
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_STARTED: ${{ steps.probe.outputs.started }}
          CHROME: ${{ matrix.chrome }}
          MAPPER: ${{ matrix.mapper }}
        run: |
          mkdir -p target/raw-protocol
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'target/raw-protocol/evidence.json';
          let status = 'NOTRUN';
          let evidenceOutcome = 'MISSING';
          if (fs.existsSync(file)) {
            try {
              const evidence = JSON.parse(fs.readFileSync(file, 'utf8'));
              evidenceOutcome = evidence.outcome;
              status = evidenceOutcome === 'PASS' && process.env.PROBE_OUTCOME === 'success'
                && evidence.evidenceOverflow === false && evidence.jsonParseFailures === 0 ? 'PASS' : 'FAIL';
            } catch { status = 'FAIL'; evidenceOutcome = 'INVALID_JSON'; }
          } else if (process.env.PROBE_STARTED === 'true') status = 'FAIL';
          const provenanceFile = 'target/raw-protocol/provenance.json';
          const provenance = fs.existsSync(provenanceFile) ? JSON.parse(fs.readFileSync(provenanceFile, 'utf8')) : {};
          const result = {status, evidenceOutcome, probeStepOutcome: process.env.PROBE_OUTCOME,
            chrome: process.env.CHROME, mapper: process.env.MAPPER,
            actualChrome: provenance.chromeVersion || 'NOTRUN', actualDriver: provenance.chromeDriverVersion || 'NOTRUN'};
          fs.writeFileSync('target/raw-protocol/summary.json', JSON.stringify(result, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Raw BiDi wire diagnostic (${result.chrome}, ${result.mapper})\nResult: ${status}\nEvidence: ${evidenceOutcome}\nProbe step: ${result.probeStepOutcome}\nActual Chrome: ${result.actualChrome}\nActual ChromeDriver: ${result.actualDriver}\nManual, non-blocking diagnostic; required release gates remain in force.\n`);
          NODE
      - name: Preserve only sanitized JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-bidi-wire-${{ matrix.chrome }}-${{ matrix.mapper }}
          if-no-files-found: warn
          path: |
            target/raw-protocol/evidence.json
            target/raw-protocol/cdp.json
            target/raw-protocol/provenance.json
            target/raw-protocol/summary.json
