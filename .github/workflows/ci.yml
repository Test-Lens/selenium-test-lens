name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check reactor version
        shell: pwsh
        run: ./scripts/check-reactor-versions.ps1 -ExpectedVersion 0.2.0-SNAPSHOT

      - name: Run tests
        run: mvn -q test

      - name: Check public API documentation manifest
        shell: pwsh
        run: ./scripts/check-public-api.ps1

      - name: Check documented Java signatures
        shell: pwsh
        run: ./scripts/check-doc-signatures.ps1

      - name: Build release artifacts
        run: mvn -U -Prelease-artifacts -DskipTests package

      - name: Validate release artifact whitelist and licenses
        shell: pwsh
        run: ./scripts/validate-release-packaging.ps1

  browser-integration:
    name: Browser integration (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Set up geckodriver
        if: matrix.browser == 'firefox'
        id: setup-geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve geckodriver path
        if: matrix.browser == 'firefox'
        id: resolve-geckodriver
        shell: bash
        run: |
          geckodriver_path="$(command -v geckodriver || true)"
          if [[ -z "$geckodriver_path" ]]; then
            echo "::error::geckodriver was installed but could not be resolved from PATH"
            exit 1
          fi
          if [[ ! -x "$geckodriver_path" ]]; then
            echo "::error::resolved geckodriver is not executable: $geckodriver_path"
            exit 1
          fi
          echo "geckodriver-path=$geckodriver_path" >> "$GITHUB_OUTPUT"

      - name: Report selected Chrome binaries
        if: matrix.browser == 'chrome'
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome binary: $TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          echo "ChromeDriver binary: $TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version
          echo "WebDriver BiDi: enabled for dedicated network integration tests"

      - name: Report selected Firefox binaries
        if: matrix.browser == 'firefox'
        env:
          TEST_FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
          TEST_GECKODRIVER_BINARY: ${{ steps.resolve-geckodriver.outputs.geckodriver-path }}
        run: |
          echo "Firefox binary: $TEST_FIREFOX_BINARY"
          test -x "$TEST_FIREFOX_BINARY" || { echo "::error::Firefox binary is not executable: $TEST_FIREFOX_BINARY"; exit 1; }
          "$TEST_FIREFOX_BINARY" --version
          echo "GeckoDriver binary: $TEST_GECKODRIVER_BINARY"
          test -x "$TEST_GECKODRIVER_BINARY" || { echo "::error::GeckoDriver binary is not executable: $TEST_GECKODRIVER_BINARY"; exit 1; }
          "$TEST_GECKODRIVER_BINARY" --version
          echo "WebDriver BiDi: enabled for dedicated network integration tests"

      - name: Run Chrome real-browser integration tests
        if: matrix.browser == 'chrome'
        run: >-
          mvn -Pbrowser-it -Dbrowser=chrome -Dheaded=false
          -Dtest.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
          -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
          verify

      - name: Run Firefox real-browser integration tests
        if: matrix.browser == 'firefox'
        run: >-
          mvn -Pbrowser-it -Dbrowser=firefox -Dheaded=false
          -Dtest.firefox.binary="${{ steps.setup-firefox.outputs.firefox-path }}"
          -Dwebdriver.gecko.driver="${{ steps.resolve-geckodriver.outputs.geckodriver-path }}"
          verify

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-${{ matrix.browser }}-failure
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/ui-test-lens/**

  headed-chrome-smoke:
    name: Headed Chrome smoke (non-blocking)
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Report selected Chrome binaries
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome binary: $TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          echo "ChromeDriver binary: $TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version

      - name: Run headed Chrome smoke under Xvfb
        run: >-
          xvfb-run -a mvn -Pbrowser-it -Dbrowser=chrome -Dheaded=true
          -Dtest.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
          -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
          verify

      - name: Upload headed smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headed-chrome-smoke-failure
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/ui-test-lens/**
