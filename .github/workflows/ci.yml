name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  consumer-compatibility:
    name: Consumer compatibility (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate Maven and Gradle clean-room consumers
        shell: pwsh
        run: ./scripts/validate-consumer-compatibility.ps1 -KeepWorkDirectoryOnFailure

      - name: Upload consumer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-compatibility-jdk-${{ matrix.java }}-failure
          if-no-files-found: warn
          path: |
            consumer-tests/gradle/build/reports/**
            consumer-tests/gradle/build/test-results/**
            **/target/surefire-reports/**

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check reactor version
        shell: pwsh
        run: ./scripts/check-reactor-versions.ps1

      - name: Run tests
        run: mvn -q test

      - name: Check public API documentation manifest
        shell: pwsh
        run: ./scripts/check-public-api.ps1

      - name: Check public API since tags
        shell: pwsh
        run: ./scripts/check-public-api-since.ps1

      - name: Check documented Java signatures
        shell: pwsh
        run: ./scripts/check-doc-signatures.ps1

      - name: Check published Javadoc language
        shell: pwsh
        run: |
          ./scripts/check-public-javadoc-language.ps1
          ./scripts/test-public-javadoc-language.ps1

      - name: Build release artifacts
        run: mvn -U -Prelease-artifacts -DskipTests package

      - name: Validate release artifact whitelist and licenses
        shell: pwsh
        run: ./scripts/validate-release-packaging.ps1

  browser-integration:
    name: Browser integration (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Set up geckodriver
        if: matrix.browser == 'firefox'
        id: setup-geckodriver
        uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8 # distribution commit with bundled index.js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve geckodriver path
        if: matrix.browser == 'firefox'
        id: resolve-geckodriver
        shell: bash
        run: |
          geckodriver_path="$(command -v geckodriver || true)"
          if [[ -z "$geckodriver_path" ]]; then
            echo "::error::geckodriver was installed but could not be resolved from PATH"
            exit 1
          fi
          if [[ ! -x "$geckodriver_path" ]]; then
            echo "::error::resolved geckodriver is not executable: $geckodriver_path"
            exit 1
          fi
          echo "geckodriver-path=$geckodriver_path" >> "$GITHUB_OUTPUT"

      - name: Report selected Chrome binaries
        if: matrix.browser == 'chrome'
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome binary: $TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          echo "ChromeDriver binary: $TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version
          echo "WebDriver BiDi: enabled for dedicated network integration tests"

      - name: Report selected Firefox binaries
        if: matrix.browser == 'firefox'
        env:
          TEST_FIREFOX_BINARY: ${{ steps.setup-firefox.outputs.firefox-path }}
          TEST_GECKODRIVER_BINARY: ${{ steps.resolve-geckodriver.outputs.geckodriver-path }}
        run: |
          echo "Firefox binary: $TEST_FIREFOX_BINARY"
          test -x "$TEST_FIREFOX_BINARY" || { echo "::error::Firefox binary is not executable: $TEST_FIREFOX_BINARY"; exit 1; }
          "$TEST_FIREFOX_BINARY" --version
          echo "GeckoDriver binary: $TEST_GECKODRIVER_BINARY"
          test -x "$TEST_GECKODRIVER_BINARY" || { echo "::error::GeckoDriver binary is not executable: $TEST_GECKODRIVER_BINARY"; exit 1; }
          "$TEST_GECKODRIVER_BINARY" --version
          echo "WebDriver BiDi: enabled for dedicated network integration tests"

      - name: Run Chrome real-browser integration tests
        if: matrix.browser == 'chrome'
        run: >-
          mvn -Pbrowser-it -Dbrowser=chrome -Dheaded=false
          -Dtest.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
          -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
          verify

      - name: Run Firefox real-browser integration tests
        if: matrix.browser == 'firefox'
        run: >-
          mvn -Pbrowser-it -Dbrowser=firefox -Dheaded=false
          -Dtest.firefox.binary="${{ steps.setup-firefox.outputs.firefox-path }}"
          -Dwebdriver.gecko.driver="${{ steps.resolve-geckodriver.outputs.geckodriver-path }}"
          verify

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-${{ matrix.browser }}-failure
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/ui-test-lens/**

  linux-external-certification:
    name: Linux external consumer (JDK 17, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Report Linux certification environment
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          SE_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SE_BROWSER_NO_SANDBOX: "true"
        shell: bash
        run: |
          java -version
          mvn --version
          pwsh --version
          test -x "$TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          test -x "$TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version
          echo "SE_BROWSER_PATH=${SE_BROWSER_PATH:-<unset>}"
          echo "SE_BROWSER_NO_SANDBOX=${SE_BROWSER_NO_SANDBOX:-<unset>}"
          echo "webdriver.chrome.driver=<not supplied by certification job>"
          for candidate in google-chrome chrome chromium chromium-browser chromedriver; do
            resolved="$(command -v "$candidate" 2>/dev/null || true)"
            if [ -n "$resolved" ]; then echo "PATH candidate $candidate=$resolved"; fi
          done

      - name: Certify staged external Studio consumer
        env:
          # Keep Selenium Manager's browser/driver resolution coherent. Supplying only
          # webdriver.chrome.driver made ChromeDriver 155 launch the system Chrome 154.
          SE_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Chrome for Testing is an archive install without a usable SUID sandbox
          # on the Ubuntu runner. This is explicit CI host configuration; Studio
          # keeps Chrome sandboxing enabled by default everywhere else.
          SE_BROWSER_NO_SANDBOX: "true"
        shell: pwsh
        run: |
          $tempRoot = Join-Path "${{ runner.temp }}" ("test-lens-s15-temp-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
          try {
            $env:TMPDIR = $tempRoot
            $env:TEMP = $tempRoot
            $env:TMP = $tempRoot
            $repositoryRoot = (Get-Location).Path
            Import-Module (Join-Path $repositoryRoot "scripts/ReleaseReactor.psm1") -Force
            $rootPom = Read-TestLensPom (Join-Path $repositoryRoot "pom.xml")
            $reactorVersion = Get-TestLensPomText $rootPom "/m:project/m:version"
            ./scripts/check-reactor-versions.ps1 -ExpectedVersion $reactorVersion | Out-Host
            $repository = Join-Path $tempRoot "empty-maven-repository"
            ./scripts/certify-0.5.0-external-consumer-linux.ps1 `
              -Version $reactorVersion `
              -MavenRepository $repository

            $spaceConsumer = Join-Path $tempRoot "test lens consumer with spaces"
            Copy-Item -LiteralPath ./scripts/fixtures/s15-external-consumer `
              -Destination $spaceConsumer -Recurse -Force
            & mvn "-Dmaven.repo.local=$repository" -f (Join-Path $spaceConsumer "pom.xml") test-compile
            if ($LASTEXITCODE -ne 0) { throw "External consumer path-with-spaces compilation failed" }
          } finally {
            Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload external certification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-external-certification-failure
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/test-lens-s15-temp/**/studio-*.log
            ${{ runner.temp }}/test-lens-s15-temp/**/target/surefire-reports/**

  headed-chrome-smoke:
    name: Headed Chrome smoke (non-blocking)
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Report selected Chrome binaries
        env:
          TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          TEST_CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          echo "Chrome binary: $TEST_CHROME_BINARY"
          "$TEST_CHROME_BINARY" --version
          echo "ChromeDriver binary: $TEST_CHROMEDRIVER_BINARY"
          "$TEST_CHROMEDRIVER_BINARY" --version

      - name: Run headed Chrome smoke under Xvfb
        run: >-
          xvfb-run -a mvn -Pbrowser-it -Dbrowser=chrome -Dheaded=true
          -Dtest.chrome.binary="${{ steps.setup-chrome.outputs.chrome-path }}"
          -Dwebdriver.chrome.driver="${{ steps.setup-chrome.outputs.chromedriver-path }}"
          verify

      - name: Upload headed smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headed-chrome-smoke-failure
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/ui-test-lens/**
