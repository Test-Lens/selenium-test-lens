name: Controlled HTTP upgrade diagnostic

on:
  workflow_dispatch:
    inputs:
      case_set:
        description: Run all cases or only the paired public-host HTTPS experiment
        type: choice
        default: all
        options: [all, https-only]

permissions:
  contents: read
  actions: read

jobs:
  controlled-probes:
    name: ${{ matrix.os }} / Chrome ${{ matrix.chrome }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        chrome: ['157.0.8103.78', '158.0.8127.36']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: browser-actions/setup-chrome@v2
        id: browser
        with:
          chrome-version: ${{ matrix.chrome }}
          install-chromedriver: true
      - name: Verify immutable source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api repos/Test-Lens/selenium-test-lens/actions/runs/44692428506 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Source run lookup failed' }
          if ($run.repository.full_name -ne 'Test-Lens/selenium-test-lens' -or
              $run.head_sha -ne '9f13b89b1928b7cbb9de46d3c9568733dcd5201a' -or
              $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Source provenance mismatch' }
          New-Item -ItemType Directory -Force target/controlled-http-evidence | Out-Null
          @{ repository = $run.repository.full_name; runId = $run.id; sourceSha = $run.head_sha; conclusion = $run.conclusion; diagnosticSha = $env:GITHUB_SHA } |
            ConvertTo-Json | Set-Content target/controlled-http-evidence/provenance.json
      - uses: actions/download-artifact@v4
        with:
          name: selenium-bidi-binary
          path: target/controlled-frozen-download
          github-token: ${{ github.token }}
          repository: Test-Lens/selenium-test-lens
          run-id: '44692428506'
      - name: Run bounded controlled probes
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          DRIVER_BINARY: ${{ steps.browser.outputs.chromedriver-path }}
          EXPECTED_CHROME: ${{ matrix.chrome }}
        run: |
          ./consumer-tests/selenium-bidi/protocol-reproducer/controlled/run-controlled-probes.ps1 -ChromeBinary $env:CHROME_BINARY -ChromeDriver $env:DRIVER_BINARY -ExpectedChrome $env:EXPECTED_CHROME -CaseSet '${{ inputs.case_set }}'
      - name: Publish actual case outcomes
        if: always()
        run: |
          $summary = 'target/controlled-http-evidence/outcomes.json'
          "### Controlled diagnostic: ${{ matrix.os }} / ${{ matrix.chrome }}" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path $summary) {
            '| Case | Result | Exit | Reason |' >> $env:GITHUB_STEP_SUMMARY
            '| --- | --- | --- | --- |' >> $env:GITHUB_STEP_SUMMARY
            Get-Content $summary -Raw | ConvertFrom-Json | ForEach-Object {
              "| $($_.case) | $($_.status) | $($_.exitCode) | $($_.reason) |" >> $env:GITHUB_STEP_SUMMARY
            }
          } else { 'NOTRUN: setup did not complete; inspect the failed step.' >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-http-${{ matrix.os }}-${{ matrix.chrome }}
          path: target/controlled-http-evidence/**
          if-no-files-found: warn
          retention-days: 7
