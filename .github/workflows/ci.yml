name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -q test

      - name: Check public API documentation manifest
        shell: pwsh
        run: ./scripts/check-public-api.ps1

      - name: Check documented Java signatures
        shell: pwsh
        run: ./scripts/check-doc-signatures.ps1

      - name: Build release artifacts
        run: mvn -U -Prelease-artifacts -DskipTests package

      - name: Validate release artifact whitelist and licenses
        shell: pwsh
        run: ./scripts/validate-release-packaging.ps1
