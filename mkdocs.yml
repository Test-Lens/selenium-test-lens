site_name: Selenium Test Lens
site_description: Observable, retryable Selenium interactions and diagnostic artifacts for an existing WebDriver.
site_url: https://test-lens.github.io/selenium-test-lens/
repo_name: Test-Lens/selenium-test-lens
repo_url: https://github.com/Test-Lens/selenium-test-lens
edit_uri: edit/main/docs/
exclude_docs: |
  CURRENT_IMPLEMENTATION_AUDIT.md
  assets/brand/README.md
  reference/public-api-boundary-review.md

not_in_nav: |
  reference/public-api/*.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
      - Installation & first test: getting-started.md
      - Existing WebDriver integration: framework-integration.md
      - Configuration: configuration.md
  - Using Test Lens:
      - Capabilities: capabilities.md
      - Elements:
          - Elements overview: elements/index.md
          - Locators: elements/locators.md
          - Actions: elements/actions.md
          - Waiting: elements/waiting.md
          - Assertions: elements/assertions.md
          - Element information: elements/information.md
          - Collections: elements/collections.md
          - Select controls: elements/select-controls.md
      - Browser Context:
          - Browser context overview: browser-context/index.md
          - Frames: browser-context/frames.md
          - Windows & tabs: browser-context/windows-tabs.md
          - Alerts, confirms & prompts: browser-context/alerts.md
      - Examples: examples.md
  - Observability:
      - Observability overview: observability/index.md
      - Visual runtime diagnostics: observability/visual-diagnostics.md
      - Screenshots & evidence: observability/screenshots-evidence.md
      - Trace: observability/trace.md
      - HTML, JSON & ZIP reports: observability/reports.md
      - Logging: observability/logging.md
  - Advanced Features:
      - Advanced features overview: advanced/index.md
      - Steps & business assertions: advanced/steps-business-assertions.md
      - Authentication state: advanced/auth-state.md
      - Network diagnostics: advanced/network.md
      - Overlay policies: advanced/overlay-policies.md
      - Visual helpers: advanced/visual-helpers.md
      - JsOverlayDebug advanced facade: advanced/js-overlay-debug.md
  - Integrations:
      - Integrations overview: integrations/index.md
      - Optional React API: integrations/react.md
  - Migration:
      - From raw Selenium: migration.md
  - Reference:
      - Complete API Reference: reference/index.md
      - TestLens: reference/test-lens.md
      - Configuration builders: reference/configuration.md
      - Result & data types: reference/result-types.md
      - Core model: reference/core-model.md
      - Advanced / low-level API: reference/advanced-low-level.md
      - Binary API catalog (optional): reference/public-api-catalog.md
      - Architecture: architecture.md
      - Real-browser integration tests: browser-integration-tests.md
      - Changelog: https://github.com/Test-Lens/selenium-test-lens/blob/main/CHANGELOG.md
      - Maven Central: https://central.sonatype.com/artifact/io.github.test-lens/selenium-test-lens/0.1.0
      - Javadoc: https://javadoc.io/doc/io.github.test-lens/selenium-test-lens/0.1.0/
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  analytics:
    provider: google
    property: G-T0B0XE6MS1
    consent:
      title: Cookie consent
      description: >-
        We use cookies to understand how the Test Lens documentation is used
        and to help us improve it.

      cookies:
        analytics:
          name: Google Analytics
          checked: false

      actions:
        - accept
        - reject
        - manage
